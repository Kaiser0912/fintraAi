<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Fintra</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f7f4ec; color: #1f2a24; text-align: center; padding: 24px;
    }
    @media (prefers-color-scheme: dark) { body { background: #14181a; color: #e8ece9; } }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { margin: 0 0 20px; opacity: .75; }
    button {
      font: inherit; border: 0; border-radius: 10px; padding: 12px 20px;
      background: #2e5f4c; color: #fff;
    }
  </style>
</head>
<body>
  <main>
    <h1>You're offline</h1>
    <p>Fintra needs an internet connection. Check your connection and try again.</p>
    <button onclick="location.href='https://fintra-ai-xi.vercel.app/dashboard'">Try again</button>
  </main>
</body>
</html>
